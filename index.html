<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site Revamp — AI Redesign Test</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         background: #fafafa; color: #111; line-height: 1.5; }
  header { max-width: 1100px; margin: 0 auto; padding: 48px 20px 8px; text-align: center; }
  header h1 { font-size: 2rem; font-weight: 700; letter-spacing: -0.02em; }
  header p { color: #555; margin-top: 8px; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 20px 64px; }
  form { display: flex; flex-direction: column; gap: 10px; max-width: 640px; margin: 16px auto 8px; }
  .row { display: flex; gap: 10px; }
  input[type="url"], input[type="text"], input[type="email"] { flex: 1; padding: 12px 14px; font-size: 1rem; border: 1px solid #ccc;
                      border-radius: 10px; background: #fff; }
  button { padding: 12px 20px; font-size: 1rem; border: 0; border-radius: 10px;
           background: #111; color: #fff; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: wait; }
  #status { text-align: center; color: #555; min-height: 1.5em; margin: 12px 0 4px; }
  #results { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
             gap: 20px; margin-top: 24px; }
  .card { background: #fff; border: 1px solid #e5e5e5; border-radius: 14px; overflow: hidden;
          display: flex; flex-direction: column; }
  .card h3 { padding: 14px 16px 4px; font-size: 1.05rem; }
  .card p.desc { padding: 0 16px 10px; color: #666; font-size: 0.9rem; }
  .card iframe { border: 0; background: #fff; height: 420px; flex: none; }
  .card .preview { display: flex; justify-content: center; overflow: hidden;
                 border-top: 1px solid #eee; background: #fff; }
  .card .view-toggle { display: flex; gap: 6px; padding: 10px 16px 0; }
  .card .view-toggle button { padding: 6px 12px; font-size: 0.85rem; border-radius: 8px;
                 background: #eee; color: #111; }
  .card .view-toggle button.active { background: #111; color: #fff; }
  .card.mobile .preview iframe { box-shadow: 0 0 0 1px #eee; }
  .card .actions { padding: 14px 16px; margin-top: auto; }
  .card .actions button { width: 100%; }
  .card.chosen { outline: 2px solid #111; }
  .note { text-align: center; color: #888; font-size: 0.85rem; margin-top: 28px; }
</style>
</head>
<body>
<header>
  <h1>Site Revamp</h1>
  <p>Enter any website and get three modern, minimal redesigns — pick your favorite and the code is sent out by email.</p>
</header>
<main>
  <form id="revamp-form">
    <div class="row">
      <input type="text" id="visitor-name" placeholder="Your name" autocomplete="name" required>
      <input type="email" id="visitor-email" placeholder="Your email" autocomplete="email" required>
    </div>
    <div class="row">
      <input type="url" id="site-url" placeholder="https://example.com" required>
      <button type="submit" id="generate-btn">Generate 3 redesigns</button>
    </div>
    <div class="row">
      <input type="url" id="mirror-url" placeholder="Site to mirror (optional) — a site whose style you'd like yours to follow">
    </div>
  </form>
  <div id="status"></div>
  <section id="results"></section>
  <p class="note">Test version — redesigns are generated by AI from the public content of the site you enter.</p>
</main>

<script>
// Backend (Cloudflare Worker) deployed for this test site.
const BACKEND_URL = "https://website-revamp-test.dan-reddi.workers.dev";

const form = document.getElementById('revamp-form');
const statusEl = document.getElementById('status');
const resultsEl = document.getElementById('results');
const generateBtn = document.getElementById('generate-btn');
let samples = []; // [{label, description, html}]
let visitor = { name: '', email: '' };
let mirrorUrl = '';

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const url = document.getElementById('site-url').value.trim();
  mirrorUrl = document.getElementById('mirror-url').value.trim();
  visitor = {
    name: document.getElementById('visitor-name').value.trim(),
    email: document.getElementById('visitor-email').value.trim()
  };
  if (!url) return;
  resultsEl.innerHTML = '';
  samples = [];
  generateBtn.disabled = true;
  statusEl.textContent = 'Reading the site and generating three redesigns… this can take a minute.';
  try {
    let data = null;
    for (let attempt = 0; attempt < 3 && !data; attempt++) {
      const res = await fetch(BACKEND_URL + '/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url, mirrorUrl: mirrorUrl || undefined })
      });
      if (res.ok) { data = await res.json(); break; }
      let busy = false;
      try {
        const errData = await res.json();
        busy = /503/.test(errData.error || '');
      } catch (_) {}
      if (busy && attempt < 2) {
        statusEl.textContent = "Google's AI is busy — retrying automatically…";
        await new Promise(r => setTimeout(r, 4000));
        continue;
      }
      throw new Error(busy
        ? "Google's AI is busy right now — please try again in a moment."
        : 'Something went wrong generating the redesigns. Please try again.');
    }
    samples = (data && data.samples) || [];
    if (!samples.length) throw new Error('No samples returned');
    statusEl.textContent = 'Here are three redesigns of ' + url + ' — pick the one you like:';
    samples.forEach((s, i) => resultsEl.appendChild(cardEl(s, i, url)));
  } catch (err) {
    statusEl.textContent = err.message || 'Something went wrong generating the redesigns. Please try again.';
    console.error(err);
  } finally {
    generateBtn.disabled = false;
  }
});

function cardEl(sample, index, sourceUrl) {
  const card = document.createElement('div');
  card.className = 'card';

  const title = document.createElement('h3');
  title.textContent = sample.label || ('Design ' + (index + 1));
  card.appendChild(title);

  if (sample.description) {
    const desc = document.createElement('p');
    desc.className = 'desc';
    desc.textContent = sample.description;
    card.appendChild(desc);
  }

  const frame = document.createElement('iframe');
  frame.setAttribute('sandbox', 'allow-same-origin');
  let previewHtml = sample.html || '';
  if (!/name=["']viewport["']/i.test(previewHtml)) {
    previewHtml = previewHtml.replace(/<head[^>]*>/i,
      m => m + '<meta name="viewport" content="width=device-width, initial-scale=1">');
  }
  frame.srcdoc = previewHtml;
  const preview = document.createElement('div');
  preview.className = 'preview';
  preview.appendChild(frame);

  const toggle = document.createElement('div');
  toggle.className = 'view-toggle';
  const desktopBtn = document.createElement('button');
  desktopBtn.textContent = 'Desktop';
  desktopBtn.className = 'active';
  desktopBtn.title = 'Open the full-size desktop view in a new tab';
  const mobileBtn = document.createElement('button');
  mobileBtn.textContent = 'Mobile';
  desktopBtn.addEventListener('click', () => {
    card.classList.remove('mobile');
    desktopBtn.className = 'active';
    mobileBtn.className = '';
    fitPreview(card);
    openDesktopTab(sample);
  });
  mobileBtn.addEventListener('click', () => {
    card.classList.add('mobile');
    mobileBtn.className = 'active';
    desktopBtn.className = '';
    fitPreview(card);
  });
  toggle.appendChild(desktopBtn);
  toggle.appendChild(mobileBtn);
  card.appendChild(toggle);
  card.appendChild(preview);
  requestAnimationFrame(() => fitPreview(card));

  const actions = document.createElement('div');
  actions.className = 'actions';
  const btn = document.createElement('button');
  btn.textContent = 'Choose this design';
  btn.addEventListener('click', () => choose(index, btn, sourceUrl));
  actions.appendChild(btn);
  card.appendChild(actions);
  return card;
}

function openDesktopTab(sample) {
  let html = sample.html || '';
  html = html.replace(/<script[\s\S]*?<\/script>/gi, '');
  const blob = new Blob([html], { type: 'text/html' });
  window.open(URL.createObjectURL(blob), '_blank');
}

function fitPreview(card) {
  const preview = card.querySelector('.preview');
  const frame = card.querySelector('iframe');
  if (!preview || !frame) return;
  const isMobile = card.classList.contains('mobile');
  const deviceWidth = isMobile ? 375 : 1100;
  const deviceHeight = isMobile ? 420 : 640;
  const scale = Math.min(1, preview.clientWidth / deviceWidth);
  frame.style.width = deviceWidth + 'px';
  frame.style.height = deviceHeight + 'px';
  frame.style.transform = 'scale(' + scale + ')';
  frame.style.transformOrigin = 'top center';
  preview.style.height = (deviceHeight * scale) + 'px';
}

window.addEventListener('resize', () => {
  document.querySelectorAll('.card').forEach(fitPreview);
});

async function choose(index, btn, sourceUrl) {
  const sample = samples[index];
  if (!sample) return;
  btn.disabled = true;
  btn.textContent = 'Sending…';
  try {
    const res = await fetch(BACKEND_URL + '/choose', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        sourceUrl,
        label: sample.label || ('Design ' + (index + 1)),
        html: sample.html,
        name: visitor.name,
        email: visitor.email,
        mirrorUrl: mirrorUrl || undefined
      })
    });
    if (!res.ok) throw new Error('Backend returned ' + res.status);
    document.querySelectorAll('.card').forEach(c => c.classList.remove('chosen'));
    btn.closest('.card').classList.add('chosen');
    btn.textContent = 'Chosen — code sent by email ✓';
    statusEl.textContent = 'Done. The code for "' + (sample.label || 'your pick') + '" has been emailed.';
  } catch (err) {
    btn.disabled = false;
    btn.textContent = 'Choose this design';
    statusEl.textContent = 'Could not send the email. Please try again.';
    console.error(err);
  }
}
</script>
</body>
</html>
